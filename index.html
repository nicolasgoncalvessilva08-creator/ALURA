
<!DOCTYPE html>

<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciência no Cotidiano</title>
  <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            gap: 20px;
        }

        img {
            margin-top: 20px;
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Ciência no Cotidiano</h1>
    </header>

    <main>
        <img src="marie.jpeg" alt="Foto da Marie Curie">
        <div>
            <h2>Meu primeiro post</h2>
            <p>Por: Tatiana Burkater</p>
            <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar fatos e espaço para quem gosta de entender como o mundo funciona.</p>
            <blockquote>
                <p><em>"Na vida, não existe nada a temer, mas a entender."</em></p>
            </blockquote>
            <button>❤️<span>0</span></button>
            <button>⭐<span>5</span></button>
        </div>
    </main>

    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach(function(botao) {
            botao.addEventListener("click", botaoClicado);
        });

        function botaoClicado() {
            let texto = botao.querySelector("span");
            if (texto) {
                texto.textContent++;
            }
        }
    </script>
</body>
</html>
